name: Go CI
on: [push, pull_request]

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Vet
        run: go vet ./...
      - name: Race tests on macOS and Linux
        if: runner.os != 'Windows'
        env:
          CGO_ENABLED: '1'
          # The CLI self-scan also visits the independent desktop module.
          GOTOOLCHAIN: auto
        run: go test -race -count=1 ./...
      - name: Test on Windows
        if: runner.os == 'Windows'
        env:
          GOTOOLCHAIN: auto
        shell: pwsh
        run: |
          if (Get-Command gcc -ErrorAction SilentlyContinue) {
            $env:CGO_ENABLED = '1'
            go test -race -count=1 ./...
          } else {
            Write-Output 'GCC is unavailable. Running the Windows suite without the race detector.'
            $env:CGO_ENABLED = '0'
            go test -count=1 ./...
          }
          exit $LASTEXITCODE
      - name: Build macOS arm64
        env:
          CGO_ENABLED: '0'
          GOOS: darwin
          GOARCH: arm64
        run: go build ./...
      - name: Build Windows amd64
        env:
          CGO_ENABLED: '0'
          GOOS: windows
          GOARCH: amd64
        run: go build ./...

  desktop-build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: desktop/go.mod
          cache-dependency-path: desktop/go.sum
      - name: Vet desktop
        run: go vet ./...
      - name: Test desktop
        run: go test -count=1 ./...
      - name: Build native macOS application
        if: runner.os == 'macOS'
        shell: bash
        run: bash ./scripts/build-macos.sh
      - name: Build native Windows application
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/build-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ runner.os }}
          path: dist/slopguard-*.zip
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [verify, desktop-build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: release-assets
          merge-multiple: true
      - name: Create GitHub Release draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            release-assets/slopguard-macos.zip \
            release-assets/slopguard-windows.zip \
            --repo "$GITHUB_REPOSITORY" --verify-tag --draft --generate-notes
